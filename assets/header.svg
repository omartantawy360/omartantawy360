<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="softGlow" cx="0%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .kicker {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -0.8px;
      fill: #ffffff;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #a7f3d0;
    }
    .stack-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
      font-size: 11px;
      font-weight: 500;
      fill: #cbd5e1;
    }
  </style>

  <!-- Card Canvas -->
  <rect x="1" y="1" width="998" height="178" rx="12" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="178" rx="12" fill="url(#softGlow)"/>
  <rect x="1" y="1" width="998" height="178" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Accent Gradient Line -->
  <path d="M 12 1 L 988 1" stroke="url(#accentLine)" stroke-width="2" stroke-linecap="round"/>

  <!-- Content Block -->
  <g transform="translate(48, 42)">
    <!-- Role Kicker -->
    <text x="0" y="0" class="kicker">Full-Stack Developer &amp; Front-End Specialist</text>

    <!-- Name -->
    <text x="0" y="44" class="name">Omar Tantawy</text>

    <!-- Tagline -->
    <text x="0" y="74" class="tagline">Crafting modern, type-safe web applications with React 19, Next.js (App Router) &amp; Node.js</text>

    <!-- Tech Pills -->
    <g transform="translate(0, 96)">
      <g transform="translate(0, 0)">
        <rect width="76" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="38" y="15" text-anchor="middle" class="stack-tag">React 19</text>
      </g>
      <g transform="translate(84, 0)">
        <rect width="70" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="35" y="15" text-anchor="middle" class="stack-tag">Next.js</text>
      </g>
      <g transform="translate(162, 0)">
        <rect width="90" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="45" y="15" text-anchor="middle" class="stack-tag">TypeScript</text>
      </g>
      <g transform="translate(260, 0)">
        <rect width="92" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="46" y="15" text-anchor="middle" class="stack-tag">Tailwind CSS</text>
      </g>
      <g transform="translate(360, 0)">
        <rect width="72" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="36" y="15" text-anchor="middle" class="stack-tag">Node.js</text>
      </g>
      <g transform="translate(440, 0)">
        <rect width="92" height="22" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="46" y="15" text-anchor="middle" class="stack-tag">PostgreSQL</text>
      </g>
    </g>
  </g>

  <!-- Right Status Capsule -->
  <g transform="translate(790, 42)">
    <rect width="162" height="28" rx="14" fill="#064e3b" fill-opacity="0.4" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#34d399"/>
    <text x="28" y="18" class="status-text">AVAILABLE FOR HIRE</text>
  </g>
</svg>
