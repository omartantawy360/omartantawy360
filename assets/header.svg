<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" fill="none">
  <defs>
    <!-- Architectural Technical Grid -->
    <pattern id="swissGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#E6E0D4" stroke-width="0.9"/>
    </pattern>

    <filter id="neoShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121212" flood-opacity="1"/>
    </filter>
  </defs>

  <style>
    @keyframes spinKinetic {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes stickerFloat {
      0%, 100% { transform: translateY(0px) rotate(-5deg); }
      50% { transform: translateY(-5px) rotate(-4deg); }
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes marqueeMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .font-mono {
      font-family: 'Space Mono', 'Fira Code', 'Courier New', monospace;
    }
    .font-sans {
      font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .title-large {
      font-family: 'Space Grotesk', 'Inter', -apple-system, sans-serif;
      font-weight: 900;
      font-size: 96px;
      letter-spacing: -3px;
      line-height: 0.9;
    }
    .star-spinner {
      transform-box: fill-box;
      transform-origin: center;
      animation: spinKinetic 16s linear infinite;
    }
    .floating-sticker {
      transform-box: fill-box;
      transform-origin: center;
      animation: stickerFloat 4s ease-in-out infinite;
    }
    .beacon-pulse {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulseLive 2s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1000" height="380" fill="#F5F2EA"/>
  <rect width="1000" height="380" fill="url(#swissGrid)"/>

  <!-- Neo-Brutalist Frame -->
  <rect x="2" y="2" width="996" height="376" fill="none" stroke="#121212" stroke-width="2.5"/>

  <!-- ================= TOP STATUS BAR ================= -->
  <g transform="translate(0, 0)">
    <line x1="0" y1="42" x2="1000" y2="42" stroke="#121212" stroke-width="1.8"/>

    <!-- Left: Monogram Badge -->
    <g transform="translate(20, 10)">
      <rect width="24" height="22" fill="#FF4D30" stroke="#121212" stroke-width="1.4"/>
      <text x="12" y="15" text-anchor="middle" fill="#FFFFFF" class="font-sans" font-weight="900" font-size="11" letter-spacing="-0.5">OT</text>
    </g>

    <!-- Title & Mode -->
    <g transform="translate(52, 24)">
      <text x="0" y="0" fill="#121212" class="font-sans" font-weight="800" font-size="11.5" letter-spacing="1">OMAR TANTAWY</text>
      <text x="110" y="0" fill="#71717A" class="font-mono" font-size="9.5"> // SWISS KINETIC SPEC</text>
    </g>

    <!-- Center Coordinates -->
    <g transform="translate(420, 24)">
      <text x="0" y="0" fill="#121212" class="font-mono" font-size="9.5" font-weight="600" letter-spacing="0.5">CAIRO, EG [ 30.0444° N, 31.2357° E ]</text>
    </g>

    <!-- Right Live Beacon -->
    <g transform="translate(820, 12)">
      <rect width="160" height="20" fill="#FAF8F5" stroke="#121212" stroke-width="1.2"/>
      <circle cx="12" cy="10" r="3.5" fill="#FF4D30" class="beacon-pulse"/>
      <text x="24" y="14" fill="#121212" class="font-mono" font-size="9" font-weight="700" letter-spacing="0.5">AVAILABLE FOR HIRE</text>
    </g>
  </g>

  <!-- ================= HERO CONTENT AREA ================= -->
  <g transform="translate(32, 60)">

    <!-- Animated Floating Sticker -->
    <g class="floating-sticker" transform="translate(80, 8)" filter="url(#neoShadow)">
      <rect width="205" height="25" fill="#D4FF3A" stroke="#121212" stroke-width="1.6"/>
      <text x="102" y="17" text-anchor="middle" fill="#121212" class="font-mono" font-weight="800" font-size="10" letter-spacing="1">★ KINETIC FRONTEND ARCHITECT ★</text>
    </g>

    <!-- Headline Line 1: OMAR + Animated Rotating Starburst -->
    <g transform="translate(0, 102)">
      <text x="0" y="0" class="title-large" fill="#121212">OMAR</text>

      <!-- Rotating 8-Point Kinetic Starburst -->
      <g transform="translate(390, -42)">
        <polygon class="star-spinner" points="40,0 49,26 77,15 60,39 77,63 49,52 40,78 31,52 3,63 20,39 3,15 31,26" fill="#FF4D30"/>
      </g>
    </g>

    <!-- Headline Line 2: TANTAWY (Vermillion) -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" class="title-large" fill="#FF4D30">TANTAWY</text>
    </g>

    <!-- Manifesto Text with Highlighter Badges -->
    <g transform="translate(2, 222)">
      <text x="0" y="22" class="font-sans" font-size="20" font-weight="700" fill="#121212" letter-spacing="-0.3">
        Crafting
      </text>

      <!-- Highlighter 1: sub-second vitals -->
      <g transform="translate(84, 4)">
        <rect width="170" height="26" fill="#D4FF3A" stroke="#121212" stroke-width="1.4"/>
        <text x="85" y="18" text-anchor="middle" class="font-sans" font-size="17" font-weight="800" fill="#121212">sub-second vitals</text>
      </g>

      <text x="264" y="22" class="font-sans" font-size="20" font-weight="700" fill="#121212" letter-spacing="-0.3">
        with
      </text>

      <!-- Highlighter 2: React 19 & Next.js -->
      <g transform="translate(312, 4)">
        <rect width="180" height="26" fill="#FAF8F5" stroke="#121212" stroke-width="1.4"/>
        <text x="90" y="18" text-anchor="middle" class="font-sans" font-size="17" font-weight="800" fill="#FF4D30">React 19 &amp; Next.js</text>
      </g>

      <text x="502" y="22" class="font-sans" font-size="20" font-weight="700" fill="#121212" letter-spacing="-0.3">
        &amp; scalable full-stack persistence.
      </text>
    </g>

  </g>

  <!-- ================= BOTTOM TECHNICAL RIBBON ================= -->
  <g transform="translate(0, 340)">
    <rect width="1000" height="40" fill="#121212"/>
    <g transform="translate(24, 25)">
      <text x="0" y="0" fill="#D4FF3A" class="font-mono" font-size="11" font-weight="800" letter-spacing="1.5">● SPEC: 2026</text>
      <text x="120" y="0" fill="#FAF8F5" class="font-mono" font-size="11" letter-spacing="1">REACT 19 • NEXT.JS (APP ROUTER) • TYPESCRIPT • TAILWIND CSS • NODE.JS • POSTGRESQL • SUPABASE</text>
      <text x="910" y="0" fill="#FF4D30" class="font-mono" font-size="11" font-weight="800">100% KINETIC ↵</text>
    </g>
  </g>

</svg>
