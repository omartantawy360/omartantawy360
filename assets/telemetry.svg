<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" fill="none">
  <defs>
    <!-- Architectural Grid -->
    <pattern id="telemetryGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E6E0D4" stroke-width="0.8"/>
    </pattern>

    <filter id="boxShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#121212" flood-opacity="1"/>
    </filter>
  </defs>

  <style>
    @keyframes slowRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes barFill {
      0%, 100% { width: 99%; }
      50% { width: 96%; }
    }

    .font-mono {
      font-family: 'Space Mono', 'Fira Code', 'Courier New', monospace;
    }
    .font-sans {
      font-family: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .metric-value {
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      font-weight: 900;
      font-size: 38px;
      letter-spacing: -1px;
      line-height: 1;
    }
    .spinner-turbine {
      transform-box: fill-box;
      transform-origin: center;
      animation: slowRotate 12s linear infinite;
    }
    .blinker {
      animation: blinkDot 2s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1000" height="240" fill="#F5F2EA"/>
  <rect width="1000" height="240" fill="url(#telemetryGrid)"/>
  <rect x="2" y="2" width="996" height="236" fill="none" stroke="#121212" stroke-width="2.5"/>

  <!-- Top Title Strip -->
  <g transform="translate(0, 0)">
    <rect width="1000" height="36" fill="#121212"/>
    <g transform="translate(24, 23)">
      <circle cx="0" cy="-4" r="3.5" fill="#D4FF3A" class="blinker"/>
      <text x="14" y="0" fill="#D4FF3A" class="font-mono" font-size="10.5" font-weight="800" letter-spacing="1">SYSTEM TELEMETRY // CORE VITALS &amp; BENCHMARKS</text>
      <text x="560" y="0" fill="#71717A" class="font-mono" font-size="10" letter-spacing="0.5">LATENCY: &lt;100MS • TARGET: 60FPS • RIGOR: STRICT</text>
      <text x="915" y="0" fill="#FF4D30" class="font-mono" font-size="10.5" font-weight="800">ENG.04 ↵</text>
    </g>
  </g>

  <!-- 4 Metric Cards Grid -->
  <g transform="translate(24, 52)">

    <!-- Card 1: Core Web Vitals -->
    <g transform="translate(0, 0)" filter="url(#boxShadow)">
      <rect width="220" height="156" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <!-- Top Tag -->
      <rect x="0" y="0" width="220" height="24" fill="#121212"/>
      <text x="12" y="16" fill="#FAF8F5" class="font-mono" font-size="9" font-weight="700">01 // CORE VITALS</text>
      <text x="208" y="16" text-anchor="end" fill="#D4FF3A" class="font-mono" font-size="9" font-weight="800">99.8%</text>

      <!-- Large Stat -->
      <text x="14" y="68" class="metric-value" fill="#121212">99.8<tspan font-size="22" fill="#FF4D30">%</tspan></text>
      <text x="14" y="90" class="font-sans" font-size="11" font-weight="700" fill="#71717A">LIGHTHOUSE BENCHMARK</text>

      <!-- Progress Bar Track -->
      <rect x="14" y="104" width="192" height="8" fill="#E6E0D4" stroke="#121212" stroke-width="1"/>
      <rect x="14" y="104" width="188" height="8" fill="#FF4D30"/>

      <text x="14" y="132" class="font-mono" font-size="8.5" fill="#121212">Sub-100ms LCP • Zero CLS</text>
    </g>

    <!-- Card 2: Type Safety Strictness -->
    <g transform="translate(244, 0)" filter="url(#boxShadow)">
      <rect width="220" height="156" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <!-- Top Tag -->
      <rect x="0" y="0" width="220" height="24" fill="#121212"/>
      <text x="12" y="16" fill="#FAF8F5" class="font-mono" font-size="9" font-weight="700">02 // TYPE SAFETY</text>
      <text x="208" y="16" text-anchor="end" fill="#D4FF3A" class="font-mono" font-size="9" font-weight="800">STRICT</text>

      <!-- Large Stat -->
      <text x="14" y="68" class="metric-value" fill="#121212">100<tspan font-size="22" fill="#D4FF3A" stroke="#121212" stroke-width="0.8">%</tspan></text>
      <text x="14" y="90" class="font-sans" font-size="11" font-weight="700" fill="#71717A">END-TO-END SCHEMA</text>

      <!-- Progress Bar Track -->
      <rect x="14" y="104" width="192" height="8" fill="#E6E0D4" stroke="#121212" stroke-width="1"/>
      <rect x="14" y="104" width="192" height="8" fill="#D4FF3A"/>

      <text x="14" y="132" class="font-mono" font-size="8.5" fill="#121212">Prisma ➔ API ➔ React 19</text>
    </g>

    <!-- Card 3: Design Token Drift -->
    <g transform="translate(488, 0)" filter="url(#boxShadow)">
      <rect width="220" height="156" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <!-- Top Tag -->
      <rect x="0" y="0" width="220" height="24" fill="#121212"/>
      <text x="12" y="16" fill="#FAF8F5" class="font-mono" font-size="9" font-weight="700">03 // DESIGN TOKENS</text>
      <text x="208" y="16" text-anchor="end" fill="#D4FF3A" class="font-mono" font-size="9" font-weight="800">0-DRIFT</text>

      <!-- Large Stat -->
      <text x="14" y="68" class="metric-value" fill="#121212">0.0<tspan font-size="22" fill="#FF4D30">px</tspan></text>
      <text x="14" y="90" class="font-sans" font-size="11" font-weight="700" fill="#71717A">FIGMA TO PRODUCTION</text>

      <!-- Progress Bar Track -->
      <rect x="14" y="104" width="192" height="8" fill="#E6E0D4" stroke="#121212" stroke-width="1"/>
      <rect x="14" y="104" width="192" height="8" fill="#121212"/>

      <text x="14" y="132" class="font-mono" font-size="8.5" fill="#121212">100% Tailwind Variable Parity</text>
    </g>

    <!-- Card 4: Kinetic Engine & Rotating Turbine -->
    <g transform="translate(732, 0)" filter="url(#boxShadow)">
      <rect width="220" height="156" fill="#FAF8F5" stroke="#121212" stroke-width="1.8"/>
      <!-- Top Tag -->
      <rect x="0" y="0" width="220" height="24" fill="#FF4D30"/>
      <text x="12" y="16" fill="#FFFFFF" class="font-mono" font-size="9" font-weight="800">04 // KINETIC ENGINE</text>
      <text x="208" y="16" text-anchor="end" fill="#FFFFFF" class="font-mono" font-size="9" font-weight="800">ACTIVE</text>

      <!-- Rotating Turbine Graphic -->
      <g transform="translate(160, 85)">
        <polygon class="spinner-turbine" points="0,-28 8,-9 28,-14 14,3 24,20 4,14 -4,28 -10,12 -28,14 -14,-2 -26,-18 -7,-12" fill="#FF4D30"/>
        <circle cx="0" cy="0" r="5" fill="#121212"/>
      </g>

      <!-- Stat -->
      <text x="14" y="68" class="metric-value" fill="#121212">60<tspan font-size="22" fill="#FF4D30">fps</tspan></text>
      <text x="14" y="90" class="font-sans" font-size="11" font-weight="700" fill="#71717A">MICRO-INTERACTION CADENCE</text>

      <g transform="translate(14, 116)">
        <rect width="115" height="20" fill="#D4FF3A" stroke="#121212" stroke-width="1"/>
        <text x="57" y="14" text-anchor="middle" fill="#121212" class="font-mono" font-size="8.5" font-weight="800">ZUSTAND + MOTION</text>
      </g>
    </g>

  </g>

</svg>
